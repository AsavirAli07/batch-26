      background: #fcfcfd;
    }

      left: 0;

      height: 100%;

  // Extract the numeric GR from username (last 4 digits before @)
  function extractNumericGR(username) {
    const match = username.match(/(\d{4})@/);
    return match ? match[1] : null;
  }

  // Build a map: key = GR display (e.g., "1001" for 110-series, "D-1001" for 209-series)
  const grMap = new Map();
  studentsData.forEach(student => {
    let key;
    if (student.series === "209") {
      // Use the explicit grDisplay (e.g., "D-1001")
      key = student.grDisplay || ("D-" + extractNumericGR(student.username));
    } else {
      // 110 series → plain numeric string
      key = extractNumericGR(student.username);
    }
    if (key) {
      if (!grMap.has(key)) grMap.set(key, []);
      grMap.get(key).push(student);
    }
  });

  // DOM elements
  const grInput = document.getElementById("grInput");
  const nameFilter = document.getElementById("nameFilter");
  const searchBtn = document.getElementById("searchBtn");
  const showAllBtn = document.getElementById("showAllBtn");
  const resultDiv = document.getElementById("result");
  const modal = document.getElementById("modal");
  const studentsListUl = document.getElementById("studentsList");
  const modalCloseBtn = document.getElementById("modal-close");

  // ------- Search by GR -------
  function performSearch() {
    let rawGr = grInput.value.trim();
    const filterName = nameFilter.value.trim().toUpperCase();

    if (!rawGr) {
      alert("Please enter a GR number (e.g., 1001 or D-1001)");
      return;
    }

    // Normalize the input
    let searchKey;
    const upper = rawGr.toUpperCase();

    if (upper.startsWith("D-")) {
      // 209 series: ensure format "D-XXXX"
      const numPart = rawGr.replace(/[^0-9]/g, "");
      if (numPart.length < 3) {
        resultDiv.style.display = "block";
        resultDiv.innerHTML = `<p style="color:#d32f2f; font-weight:600; background:#ffebee; padding:12px; border-radius:10px;">❌ Invalid D-format. Please enter like <strong>D-1001</strong>.</p>`;
        return;
      }
      searchKey = "D-" + numPart.padStart(4, "0").slice(-4);
    } else {
      // 110 series: plain 4-digit
      const numMatch = rawGr.match(/\d{4}/);
      if (!numMatch) {
        resultDiv.style.display = "block";
        resultDiv.innerHTML = `<p style="color:#d32f2f; font-weight:600; background:#ffebee; padding:12px; border-radius:10px;">❌ Invalid GR. Enter 4-digit (e.g., 1001) or D-format (e.g., D-1001).</p>`;
        return;
      }
      searchKey = numMatch[0];
    }

    const entries = grMap.get(searchKey);

    if (!entries || entries.length === 0) {
      resultDiv.style.display = "block";
      resultDiv.innerHTML = `<p style="color:#d32f2f; font-weight:600; background:#ffebee; padding:12px; border-radius:10px;">🔍 No student found with GR <strong>${searchKey}</strong>. Please check the number.</p>`;
      return;
    }

    let filtered = entries;
    if (filterName) {
      filtered = entries.filter(s => s.displayName.toUpperCase().includes(filterName));
      if (filtered.length === 0) {
        resultDiv.style.display = "block";
        resultDiv.innerHTML = `<p style="color:#d32f2f; font-weight:600; background:#ffebee; padding:12px; border-radius:10px;">😕 No student with GR ${searchKey} matches name "${nameFilter.value.trim()}".</p>`;
        return;
      }
    }

    const student = filtered[0];
    displayStudentInfo(student, searchKey);

    if (filtered.length > 1) {
      resultDiv.innerHTML += `<p style="margin-top:10px; font-size:13px; color:#666; background:#f3f0ff; padding:8px; border-radius:8px;">⚠️ Multiple entries found for GR ${searchKey}. Showing first result.</p>`;
    }
  }

  searchBtn.addEventListener("click", performSearch);
  grInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") performSearch();
  });
  nameFilter.addEventListener("keypress", (e) => {
    if (e.key === "Enter") performSearch();
  });

  // ------- Display student info card -------
  function displayStudentInfo(student, grKey) {
    resultDiv.style.display = "block";
    resultDiv.innerHTML = `
      <div class="result-header">GR No: ${grKey} · ${student.displayName}</div>
      <div class="label-set"><span>👤 Name</span><p>${student.displayName}</p></div>
      <div class="label-set"><span>📧 Username</span><p style="font-weight:500; word-break:break-all;">${student.username}</p></div>
      <div class="label-set"><span>🔑 New Password</span><p style="font-family: monospace; letter-spacing:0.5px;">${student.newPassword}</p></div>
      <div class="label-set"><span>📄 License</span><p>${student.license}</p></div>
    `;
  }

  // ------- Show All Students Modal (sorted: 110 series first, then D- series) -------
  showAllBtn.addEventListener("click", () => {
    const enriched = studentsData.map(s => {
      let grKey;
      if (s.series === "209") {
        grKey = s.grDisplay || ("D-" + extractNumericGR(s.username));
      } else {
        grKey = extractNumericGR(s.username) || "----";
      }
      return { ...s, grKey };
    });

    // Sort: plain numbers (110 series) first by numeric, then D- series by numeric
    enriched.sort((a, b) => {
      const aIsD = a.grKey.startsWith("D-");
      const bIsD = b.grKey.startsWith("D-");
      if (aIsD !== bIsD) return aIsD ? 1 : -1; // plain first
      const aNum = parseInt(a.grKey.replace(/\D/g, ""), 10) || 9999;
      const bNum = parseInt(b.grKey.replace(/\D/g, ""), 10) || 9999;
      return aNum - bNum;
    });

    studentsListUl.innerHTML = "";
    enriched.forEach(student => {
      const li = document.createElement("li");
      li.innerHTML = `<strong>GR ${student.grKey}</strong> ${student.displayName} <span style="color:#5a4ac0; font-weight:500; margin-left:auto;">${student.newPassword}</span>`;
      studentsListUl.appendChild(li);
    });
    modal.classList.add("active");
  });

  // Close modal
  modalCloseBtn.addEventListener("click", () => {
    modal.classList.remove("active");
  });
  modal.addEventListener("click", (e) => {
    if (e.target === modal) modal.classList.remove("active");
  });
</script>
